name: watchdog

# 为什么需要这个文件：
# macOS runner 排队超过 15 分钟，GitHub 会直接把 job 判为失败，
# 而这时 job 一步都没跑，build-ios-ipa.yml 里的「失败自动重试」永远不会执行。
# 所以把「重试」放在 ubuntu 上：ubuntu 2 秒就能分到机器，
# 由它反复触发 macOS 构建并轮询结果，直到成功。

on:
  workflow_dispatch:
    inputs:
      attempts:
        description: "最多尝试次数"
        required: false
        default: "10"
      runner:
        description: "macOS runner 标签"
        required: false
        default: "macos-15"
  schedule:
    # 每小时自检一次：如果最近一次构建不是成功，就自己补一轮
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: write

jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 反复触发 macOS 构建直到成功
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUNNER: ${{ inputs.runner || 'macos-15' }}
          ATTEMPTS: ${{ inputs.attempts || '10' }}
        run: |
          set -u
          api="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json")

          echo "仓库=$REPO 分支=$REF runner=$RUNNER 次数=$ATTEMPTS"

          # 只有「定时触发」才需要这层护栏：手动跑（改完代码想出新包）必须真的构建。
          if [ "${{ github.event_name }}" = "schedule" ]; then
            age=$(curl -s "${auth[@]}" "$api/actions/workflows/build-ios-ipa.yml/runs?status=success&per_page=1" | python3 -c 'import json,sys,datetime;r=(json.load(sys.stdin).get("workflow_runs") or []);print(10**9 if not r else int((datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(r[0]["created_at"].replace("Z","+00:00"))).total_seconds()))')
            if [ "$age" -lt 86400 ]; then
              echo "24 小时内已有成功构建（$((age/3600)) 小时前），定时任务跳过"
              exit 0
            fi
          fi

          for i in $(seq 1 "$ATTEMPTS"); do
            echo "::group::第 $i 次尝试 $(date -u '+%H:%M:%SZ')"

            before=$(curl -s "${auth[@]}" "$api/actions/workflows/build-ios-ipa.yml/runs?per_page=1" \
                     | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d["workflow_runs"][0]["id"] if d.get("workflow_runs") else 0)')

            curl -s -X POST "${auth[@]}" \
              "$api/actions/workflows/build-ios-ipa.yml/dispatches" \
              -d "{\"ref\":\"$REF\",\"inputs\":{\"runner\":\"$RUNNER\",\"retry\":\"0\"}}" \
              -o /dev/null -w "dispatch http=%{http_code}\n"

            # 等新 run 出现
            id=0
            for _ in $(seq 1 15); do
              sleep 4
              id=$(curl -s "${auth[@]}" "$api/actions/workflows/build-ios-ipa.yml/runs?per_page=1" \
                   | python3 -c 'import json,sys;d=json.load(sys.stdin);r=d.get("workflow_runs") or [];print(r[0]["id"] if r else 0)')
              [ "$id" != "$before" ] && [ "$id" != "0" ] && break
              id=0
            done
            if [ "$id" = "0" ]; then echo "没拿到新 run，重试触发"; continue; fi
            echo "run id=$id"

            # 轮询它（最长 40 分钟）
            conclusion=""
            for _ in $(seq 1 120); do
              read -r st cc < <(curl -s "${auth[@]}" "$api/actions/runs/$id" \
                | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("status","?"),d.get("conclusion") or "-")')
              echo "  $(date -u '+%H:%M:%SZ') $st $cc"
              if [ "$st" = "completed" ]; then conclusion="$cc"; break; fi
              sleep 20
            done
            echo "::endgroup::"

            if [ "${conclusion:-}" = "success" ]; then
              echo "✅ 第 $i 次尝试成功，run $id"
              exit 0
            fi
            echo "第 $i 次失败（${conclusion:-未完成}），继续"
            sleep 20
          done

          echo "❌ $ATTEMPTS 次都没成功"
          exit 1
