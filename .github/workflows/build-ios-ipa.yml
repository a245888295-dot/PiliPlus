name: Build iOS IPA with back button

# 在官方 .github/workflows/ios.yml 的基础上，只在最前面插一步：
# 打上 back-button.patch，给 App 加一个右下角常驻返回键。
# 其余步骤（版本号、Flutter SDK 补丁、无签名打包）与官方完全一致。
#
# 用法：仓库根目录放好 back-button.patch，然后手动触发本 workflow。

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner 标签（macos-15 通常比 macos-26 好排）"
        required: false
        default: "macos-15"
      retry:
        description: "失败自动重试次数（0 = 不重试）"
        required: false
        default: "5"
      tag:
        description: "可选：填 tag 名会额外发 Release（如 v2.2.1-back）"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      # ---- 和官方唯一的区别 ----
      - name: 注入右下角返回键
        run: |
          set -e
          # 两种情况都兼容：源码里已经有改动（用 Contents API 直接写进来的），
          # 或者只有补丁文件（手动上传 back-button.patch 的用法）。
          if grep -q "BackButtonOverlay" lib/main.dart; then
            echo "main.dart 已包含返回键，跳过补丁"
          else
            git apply back-button.patch \
              || patch -p1 -F3 --forward --no-backup-if-mismatch < back-button.patch
          fi
          echo "--- 校验改动已落地 ---"
          grep -n "floating_back_button\|BackStackObserver\|BackButtonOverlay" lib/main.dart
          test -f lib/common/widgets/floating_back_button.dart

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      # macos-15 镜像里默认 Xcode 是 16.4（iOS 18 SDK），但同机装了 Xcode 26.3。
      # 项目依赖的插件（connectivity_plus / device_info_plus 等）已经用了 iOS 26 SDK
      # 才有的符号，用 16.4 编必然报 "no member / no visible @interface"。
      # 这里按版本号挑机器上最新的 Xcode 切过去，macos-15 和 macos-26 都能一条路走通。
      - name: 切换到最新 Xcode
        run: |
          set -e
          echo "当前：$(xcodebuild -version | tr '\n' ' ')"
          pick=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$pick" ]; then
            sudo xcode-select -s "$pick"
            echo "已切换到 $pick"
          else
            echo "未找到 Xcode 26+，沿用默认"
          fi
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      # connectivity_plus 7.3.x 用了 NWPath.isUltraConstrained（iOS 26 SDK 新增成员）。
      # 源码里虽然写了 #available(iOS 26.0, *)，但那只挡运行时，挡不住编译期——
      # 在 Xcode 16 / iOS 18 SDK 的机器上会直接编译报错。
      # 这里把那 3 行删掉：卫星网络识别失效，其余完全不受影响，新旧 SDK 都能编。
      - name: 兼容旧 SDK（去掉 iOS 26 独占 API）
        run: |
          set -e
          F=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -name "connectivity_plus-*" \
              -print -quit 2>/dev/null || true)
          if [ -z "$F" ]; then echo "未找到 connectivity_plus，跳过"; exit 0; fi
          FILE="$F/ios/connectivity_plus/Sources/connectivity_plus/PathMonitorConnectivityProvider.swift"
          if [ ! -f "$FILE" ]; then echo "路径不同，跳过：$FILE"; exit 0; fi
          if grep -q isUltraConstrained "$FILE"; then
            awk 'BEGIN{skip=0} /isUltraConstrained/{skip=3} skip>0{skip--; next} {print}' \
              "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
            echo "已移除 isUltraConstrained 分支"
          fi
          grep -c isUltraConstrained "$FILE" || echo "确认：文件里已无该 API"

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
          ln -sf ./build/ios/iphoneos Payload
          # 未签名包里每个 framework 都要 ad-hoc 签一遍，否则装到设备上 dyld 不加载
          find Payload/Runner.app/Frameworks -type d -name "*.framework" \
            -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 "PiliPlus_ios_${version}_back.ipa" Payload/Runner.app
          ls -lh *.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-iOS-back-button
          path: PiliPlus_ios_*_back.ipa
          retention-days: 14

      # 成功即发 Release：这样 IPA 有个长期可下的地址，
      # 不依赖 artifact 的 14 天保留期，也不依赖我这边是否还在线。
      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || format('back-{0}', github.run_number) }}
          name: ${{ inputs.tag != '' && inputs.tag || format('PiliPlus 返回键版 · build {0}', github.run_number) }}
          body: |
            自动构建的未签名 IPA（含右下角返回键）。
            安装：TrollStore 直接打开 .ipa。
            构建 run: #${{ github.run_number }}
          files: PiliPlus_ios_*_back.ipa

      # 失败自动重跑：主要治「排队排不到机器」这种偶发问题。
      # 编译错误重跑不会自己好，但会保留日志，方便下一步定位。
      - name: 失败自动重试
        if: failure() && inputs.retry != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(( ${{ inputs.retry }} - 1 ))
          echo "剩余重试次数：$n"
          if [ "$n" -gt 0 ]; then
            sleep 30
            gh workflow run build-ios-ipa.yml \
              --repo "${{ github.repository }}" \
              --ref "${{ github.ref_name }}" \
              -f runner="${{ inputs.runner }}" \
              -f retry="$n"
            echo "已排队下一次尝试"
          else
            echo "重试次数用尽，停止"
          fi
